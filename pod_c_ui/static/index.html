<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockline Voice — Console opérateur</title>
<!-- Owned by Pod C. Vanilla JS on purpose: zero build step, survives any laptop at 4am. -->
<style>
  :root { --bg:#f6f5f1; --panel:#fff; --ink:#1d1d1b; --mute:#6b6a65; --line:#e4e2da;
          --ok:#2f7d4f; --warn:#b7791f; --block:#c0392b; --info:#3b6ea8; --accent:#0f5b4f; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:24px; padding:12px 20px; background:var(--ink); color:#fff; }
  header h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.2px; }
  .kpi { display:flex; flex-direction:column; font-size:11px; color:#bbb; }
  .kpi b { font-size:18px; color:#fff; font-variant-numeric:tabular-nums; }
  .status { margin-left:auto; padding:4px 10px; border-radius:99px; font-size:12px; background:#444; }
  .status.needs_review { background:var(--block); } .status.draft { background:var(--warn); }
  .status.confirmed, .status.injected { background:var(--ok); }
  main { display:grid; grid-template-columns: 300px 1fr 1.35fr; gap:14px; padding:14px; height:calc(100vh - 62px); }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--mute); margin:0 0 10px; }
  label { display:block; font-size:12px; color:var(--mute); margin:10px 0 4px; }
  select, textarea, input { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  textarea { height:130px; resize:vertical; }
  button { font:inherit; border:0; border-radius:6px; padding:8px 12px; cursor:pointer; background:var(--accent); color:#fff; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button.small { padding:3px 8px; font-size:12px; }
  button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  #rec.on { background:var(--block); }
  #transcript p { margin:0 0 8px; } #transcript .partial { color:var(--mute); font-style:italic; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11px; color:var(--mute); font-weight:500; border-bottom:1px solid var(--line); padding:6px 4px; }
  td { padding:7px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .raw { font-size:11px; color:var(--mute); }
  .bar { height:6px; width:70px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%; }
  .tag { display:inline-block; font-size:10px; padding:1px 6px; border-radius:99px; margin-left:4px; border:1px solid currentColor; }
  .src-history { color:var(--info); } .src-operator { color:var(--ok); } .out { color:var(--block); } .est { color:var(--warn); }
  .alert { border-left:4px solid; padding:8px 10px; margin:8px 0; border-radius:4px; background:#fafaf7; }
  .alert.block { border-color:var(--block); } .alert.warn { border-color:var(--warn); } .alert.info { border-color:var(--info); }
  .alert small { color:var(--mute); display:block; }
  .total { display:flex; justify-content:space-between; font-weight:600; padding:10px 4px; }
  .empty { color:var(--mute); font-style:italic; }
  #readback { font-size:13px; background:#f0efe9; padding:10px; border-radius:6px; margin-top:10px; }
</style>
</head>
<body>
<header>
  <h1>Stockline Voice · Console de saisie</h1>
  <div class="kpi">Lignes<b id="k-lines">0</b></div>
  <div class="kpi">Confiance<b id="k-conf">–</b></div>
  <div class="kpi">Latence extraction<b id="k-lat">–</b></div>
  <div class="kpi">Total<b id="k-total">–</b></div>
  <div class="kpi">Moteur<b id="k-engine">–</b></div>
  <span class="status" id="status">en attente</span>
</header>
<main>
  <section>
    <h2>Appel</h2>
    <label>Client (identifié par n° appelant)</label>
    <select id="customer"></select>
    <label>Scénario de test</label>
    <select id="case"><option value="">— texte libre —</option></select>
    <label>Transcription à simuler</label>
    <textarea id="text">Bonjour c'est Karim. Il me faut douze kilos de tomates grappe, cinq bottes de persil et deux colis de courgettes.</textarea>
    <div class="row">
      <button id="simulate">▶ Simuler l'appel</button>
      <button id="rec" class="ghost">🎙 Micro</button>
    </div>
    <p class="raw" id="call-id"></p>
  </section>

  <section>
    <h2>Transcription en direct</h2>
    <div id="transcript"><p class="empty">Aucun appel en cours.</p></div>
  </section>

  <section>
    <h2>Bon de commande</h2>
    <table>
      <thead><tr><th>Produit</th><th class="num">Qté</th><th class="num">€</th><th>Confiance</th><th></th></tr></thead>
      <tbody id="lines"><tr><td colspan="5" class="empty">—</td></tr></tbody>
    </table>
    <div class="total"><span>Total HT</span><span id="total">–</span></div>
    <h2 style="margin-top:14px">Alertes</h2>
    <div id="alerts"><p class="empty">—</p></div>
    <div id="readback" hidden></div>
    <div class="row">
      <button id="speak" class="ghost" disabled>🔊 Relire au client</button>
      <button id="confirm" disabled>✓ Valider & injecter ERP</button>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let callId = null, draft = null, cases = [], partial = null;
const fmt = (n, d = 2) => n == null ? '–' : Number(n).toLocaleString('fr-FR', { maximumFractionDigits: d });
const color = (c) => c >= .85 ? 'var(--ok)' : c >= .7 ? 'var(--warn)' : 'var(--block)';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function init() {
  const custs = await api('/api/agent/customers');
  $('customer').innerHTML = custs.map(c => `<option value="${c.customer_id}">${esc(c.name)} · ${c.phone ?? ''}</option>`).join('');
  cases = await api('/api/voice/cases');
  $('case').innerHTML += cases.map((c, i) => `<option value="${i}">${c.id} — ${c.features.join(', ')}</option>`).join('');
  connect();
}

$('case').onchange = () => {
  const c = cases[$('case').value];
  if (c) { $('text').value = c.transcript; $('customer').value = c.customer_id; }
};

function resetCall(id) {
  callId = id; draft = null; partial = null;
  $('call-id').textContent = 'call_id: ' + id;
  $('transcript').innerHTML = '';
  render();
}

$('simulate').onclick = async () => {
  const { call_id } = await api('/api/voice/simulate', { text: $('text').value, customer_id: $('customer').value });
  resetCall(call_id);
};

// ── micro: record in the browser, send the blob to Pod A (needs STT_PROVIDER != mock) ──
let rec = null, chunks = [];
$('rec').onclick = async () => {
  if (rec) { rec.stop(); return; }
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  rec = new MediaRecorder(stream); chunks = [];
  rec.ondataavailable = (e) => chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    $('rec').classList.remove('on'); $('rec').textContent = '🎙 Micro'; rec = null;
    const id = 'mic-' + Math.random().toString(16).slice(2, 8);
    resetCall(id);
    const fd = new FormData();
    fd.append('file', new Blob(chunks, { type: 'audio/webm' }), 'call.webm');
    fd.append('customer_id', $('customer').value); fd.append('call_id', id);
    const r = await fetch('/api/voice/upload', { method: 'POST', body: fd });
    if (!r.ok) alert('STT: ' + await r.text());
  };
  rec.start(); $('rec').classList.add('on'); $('rec').textContent = '■ Stop';
};

function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.call_id !== callId) return;
    if (ev.type === 'transcript') onTranscript(ev.payload);
    if (ev.type === 'order') { draft = ev.payload; render(); }
  };
  ws.onclose = () => setTimeout(connect, 1000);
  setInterval(() => ws.readyState === 1 && ws.send('ping'), 15000);
}

function onTranscript(t) {
  const box = $('transcript');
  if (!t.is_final) {
    if (!partial) { partial = document.createElement('p'); partial.className = 'partial'; box.appendChild(partial); }
    partial.textContent = t.text + ' …';
  } else {
    if (partial) { partial.remove(); partial = null; }
    const p = document.createElement('p');
    p.innerHTML = `<b>Client :</b> ${esc(t.text)} <span class="raw">(${Math.round(t.confidence * 100)}%)</span>`;
    box.appendChild(p);
  }
  box.parentElement.scrollTop = box.parentElement.scrollHeight;
}

async function act(action, line_id, extra = {}) {
  draft = await api('/api/agent/operator', { call_id: callId, action, line_id, ...extra });
  render();
}
window.act = act;

function render() {
  const d = draft;
  $('k-lines').textContent = d ? d.lines.length : 0;
  $('k-conf').textContent = d ? Math.round(d.global_confidence * 100) + '%' : '–';
  $('k-lat').textContent = d && d.latency.extract_ms != null ? d.latency.extract_ms + ' ms' : '–';
  $('k-total').textContent = d && d.total_eur != null ? fmt(d.total_eur) + ' €' : '–';
  $('k-engine').textContent = d ? d.extractor : '–';
  $('status').textContent = d ? d.status.replace('_', ' ') : 'en attente';
  $('status').className = 'status ' + (d ? d.status : '');
  $('speak').disabled = $('confirm').disabled = !d || d.status === 'injected';
  if (!d) { $('lines').innerHTML = '<tr><td colspan="5" class="empty">—</td></tr>'; $('alerts').innerHTML = '<p class="empty">—</p>'; $('readback').hidden = true; return; }

  $('lines').innerHTML = d.lines.map(l => `
    <tr>
      <td><b>${esc(l.product_label)}</b>
        ${l.source !== 'voice' ? `<span class="tag src-${l.source}">${l.source === 'history' ? 'historique' : 'opérateur'}</span>` : ''}
        ${l.stock_status === 'out' ? '<span class="tag out">rupture</span>' : ''}
        ${l.quantity_is_estimate ? '<span class="tag est">poids estimé</span>' : ''}
        ${l.conditional ? `<span class="tag est">${esc(l.conditional)}</span>` : ''}
        <div class="raw">« ${esc(l.raw_mention)} » ${l.sku ? '· ' + l.sku : ''}</div>
        ${l.substitution ? `<div class="raw">↪ ${esc(l.substitution.reason)} <button class="small" onclick="act('accept_substitution','${l.line_id}')">Substituer</button></div>` : ''}
        ${!l.sku || (l.candidates.length > 1 && l.confidence < .7) ? `<div class="raw">Choisir : ${l.candidates.map(c => `<button class="small ghost" onclick="act('choose_candidate','${l.line_id}',{sku:'${c.sku}'})">${esc(c.label)}</button>`).join(' ')}</div>` : ''}
      </td>
      <td class="num">${fmt(l.quantity, 3)} ${l.sell_unit ?? ''}<div class="raw">${l.spoken_quantity != null ? 'dit : ' + fmt(l.spoken_quantity) + ' ' + (l.spoken_unit ?? '') : ''}</div></td>
      <td class="num">${fmt(l.line_total_eur)}</td>
      <td>${Math.round(l.confidence * 100)}%<div class="bar"><i style="width:${l.confidence * 100}%;background:${color(l.confidence)}"></i></div></td>
      <td class="num">
        <button class="small ghost" title="Valider" onclick="act('accept_line','${l.line_id}')">✓</button>
        <button class="small ghost" title="Modifier la quantité" onclick="const q=prompt('Quantité (${l.sell_unit ?? ''})', '${l.quantity ?? ''}'); if(q) act('edit_line','${l.line_id}',{quantity:parseFloat(q.replace(',','.'))})">✎</button>
        <button class="small ghost" title="Supprimer" onclick="act('delete_line','${l.line_id}')">✕</button>
      </td>
    </tr>`).join('') || '<tr><td colspan="5" class="empty">—</td></tr>';
  $('total').textContent = fmt(d.total_eur) + ' €';

  const rank = { block: 0, warn: 1, info: 2 };
  $('alerts').innerHTML = [...d.alerts].sort((a, b) => rank[a.severity] - rank[b.severity]).map(a => `
    <div class="alert ${a.severity}"><b>${a.type.replace(/_/g, ' ').toLowerCase()}</b> — ${esc(a.message_fr)}
      ${a.suggested_action ? `<small>→ ${esc(a.suggested_action)}</small>` : ''}
      ${a.type === 'UPSELL' && a.data.sku ? `<button class="small" onclick="act('add_line',null,{sku:'${a.data.sku}',quantity:${a.data.usual ?? 1}})">Ajouter ${fmt(a.data.usual)}</button>` : ''}
    </div>`).join('') || '<p class="empty">Aucune alerte.</p>';

  $('readback').hidden = !d.readback_fr; $('readback').textContent = d.readback_fr || '';
}

$('speak').onclick = () => {
  if (!draft?.readback_fr) return;
  const u = new SpeechSynthesisUtterance(draft.readback_fr); u.lang = 'fr-FR'; u.rate = 1.05;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
};
$('confirm').onclick = () => act('confirm_order', null);

init();
</script>
</body>
</html>
